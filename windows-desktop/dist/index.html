<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ERP Inventory</title>
<style>
  :root { --bg:#f5f7fb; --fg:#1b2333; --muted:#5d6b82; --brand:#1e5eff; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0f1623; --fg:#e8edf6; --muted:#9aa7bd; } }
  html,body { height:100%; margin:0; }
  body { background:var(--bg); color:var(--fg); font-family:"Segoe UI","Nirmala UI",sans-serif;
         display:flex; align-items:center; justify-content:center; text-align:center; }
  img { width:220px; max-width:60vw; }
  p { color:var(--muted); margin:18px 0 0; font-size:15px; }
  .spin { width:28px; height:28px; margin:22px auto 0; border:3px solid #c9d3e6; border-top-color:var(--brand);
          border-radius:50%; animation:r .8s linear infinite; }
  @keyframes r { to { transform:rotate(360deg); } }
  button { margin-top:22px; padding:10px 28px; font-size:15px; border:0; border-radius:8px;
           background:var(--brand); color:#fff; cursor:pointer; }
  #offline { display:none; }
  footer { position:fixed; bottom:16px; left:0; right:0; font-size:12px; color:var(--muted); }
</style>
</head>
<body>
  <main>
    <img src="logo.png" alt="ERP Inventory">
    <div id="loading"><div class="spin"></div><p>লোড হচ্ছে…</p></div>
    <div id="offline">
      <p><b>ইন্টারনেট সংযোগ নেই</b><br>No internet connection. Please check your connection.</p>
      <button id="retry">আবার চেষ্টা করুন / Retry</button>
    </div>
  </main>
  <footer>Developed by Bongshal Tech</footer>
<script>
  // The app shows the live dashboard. Check the server is reachable first so an offline PC
  // sees a clear message instead of a browser error page.
  var START_URL = "https://erpinventory.bd/login";
  function show(id) {
    document.getElementById("loading").style.display = id === "loading" ? "block" : "none";
    document.getElementById("offline").style.display = id === "offline" ? "block" : "none";
  }
  function go() {
    show("loading");
    var done = false;
    var timer = setTimeout(function () { if (!done) { done = true; show("offline"); } }, 15000);
    fetch("https://erpinventory.bd/", { mode: "no-cors", cache: "no-store" })
      .then(function () { if (!done) { done = true; clearTimeout(timer); location.replace(START_URL); } })
      .catch(function () { if (!done) { done = true; clearTimeout(timer); show("offline"); } });
  }
  document.getElementById("retry").onclick = go;
  window.addEventListener("online", go);
  go();
</script>
</body>
</html>
