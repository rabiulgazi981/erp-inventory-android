[package]
name = "erp-inventory-mac"
version = "1.0.0"
description = "ERP Inventory for macOS by Bongshal Tech"
authors = ["Bongshal Tech"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
