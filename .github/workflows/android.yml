name: Android build

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      # Installs the Android SDK pieces this app needs (the runner image may not ship an SDK).
      - name: Android SDK
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-$HOME/android-sdk}"
          if [ ! -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            mkdir -p "$SDK/cmdline-tools"
            curl -sSfL -o /tmp/tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q /tmp/tools.zip -d /tmp/tools
            rm -rf "$SDK/cmdline-tools/latest"
            mv /tmp/tools/cmdline-tools "$SDK/cmdline-tools/latest"
          fi
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0" > /dev/null
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@v4

      - name: Core tests
        run: ./gradlew :core:test --console=plain

      - name: Debug APK
        run: ./gradlew :app:assembleDebug --console=plain

      - uses: actions/upload-artifact@v4
        with:
          name: erp-inventory-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  # Signed Play bundle. Runs only when started by hand or on a v* tag, and only when the
  # upload key secrets are set in the repository (Settings > Secrets and variables > Actions).
  release:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      HAS_KEY: ${{ secrets.RELEASE_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Android SDK
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-$HOME/android-sdk}"
          if [ ! -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            mkdir -p "$SDK/cmdline-tools"
            curl -sSfL -o /tmp/tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q /tmp/tools.zip -d /tmp/tools
            rm -rf "$SDK/cmdline-tools/latest"
            mv /tmp/tools/cmdline-tools "$SDK/cmdline-tools/latest"
          fi
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0" > /dev/null
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@v4
      - name: Upload key
        if: env.HAS_KEY == 'true'
        env:
          KEYSTORE: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
          BANNER_AD_UNIT: ${{ secrets.BANNER_AD_UNIT }}
          INTERSTITIAL_AD_UNIT: ${{ secrets.INTERSTITIAL_AD_UNIT }}
        run: |
          set -euo pipefail
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/upload.jks"
          mkdir -p ~/.gradle
          {
            echo "releaseStoreFile=$RUNNER_TEMP/upload.jks"
            echo "releaseStorePassword=$STORE_PASSWORD"
            echo "releaseKeyAlias=$KEY_ALIAS"
            echo "releaseKeyPassword=$KEY_PASSWORD"
            [ -n "$ADMOB_APP_ID" ] && echo "admobAppId=$ADMOB_APP_ID"
            [ -n "$BANNER_AD_UNIT" ] && echo "bannerAdUnit=$BANNER_AD_UNIT"
            [ -n "$INTERSTITIAL_AD_UNIT" ] && echo "interstitialAdUnit=$INTERSTITIAL_AD_UNIT"
          } >> ~/.gradle/gradle.properties
      - name: Release bundle
        run: ./gradlew :app:bundleRelease -PversionCode=${{ github.run_number }} --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: erp-inventory-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
