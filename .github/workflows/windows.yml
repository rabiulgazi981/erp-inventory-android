name: Windows desktop build

on:
  push:
    branches: [main, "claude/**"]
    paths: ["windows-desktop/**", ".github/workflows/windows.yml"]
  pull_request:
    paths: ["windows-desktop/**", ".github/workflows/windows.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: windows-desktop
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: windows-desktop/src-tauri
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: ERP-Inventory-Windows
          path: windows-desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
